<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR History - QRVault</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>QRVault</h1>

        <p class="subtitle">
            QR Code History
        </p>

        <div class="card">

            <h2>Generated QR Codes</h2>

            <form
                method="GET"
                action="{{ url_for('history') }}"
                class="search-form"
            >

                <input
                    type="text"
                    name="search"
                    placeholder="Search QR history..."
                    value="{{ search }}"
                >

                <button type="submit">
                    Search
                </button>

            </form>

            {% if qr_codes %}

                <div class="history-list">

                    {% for qr in qr_codes %}

                        <div class="history-item">

                            <span class="history-id">
                                #{{ qr[0] }}
                            </span>

                            <span class="history-content">
                                {{ qr[1] }}
                            </span>

                            <form
                                method="POST"
                                action="{{ url_for('delete_qr', qr_id=qr[0]) }}"
                            >
                                <button
                                    type="submit"
                                    class="delete-btn"
                                >
                                    Delete
                                </button>
                            </form>

                        </div>

                    {% endfor %}

                </div>

            {% else %}

                <p>
                    No matching QR codes found.
                </p>

            {% endif %}

            <a
                href="{{ url_for('home') }}"
                class="download-btn"
            >
                Generate New QR
            </a>

        </div>

    </div>

</body>
</html>
