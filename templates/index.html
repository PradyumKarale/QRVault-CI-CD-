<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QRVault</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>QRVault</h1>

        <p class="subtitle">
            QR Code Generator & History Manager
        </p>

        <div class="card">

            <h2>Generate QR Code</h2>

            <form method="POST">

                <label for="content">
                    Enter URL or Text
                </label>

                <input
                    type="text"
                    id="content"
                    name="content"
                    placeholder="https://example.com"
                    required
                >

                <button type="submit">
                    Generate QR
                </button>

            </form>

            {% if qr_available %}

                <div class="qr-result">

                    <h3>Your QR Code</h3>

                    <img
                        src="{{ url_for('qr_image') }}"
                        alt="Generated QR Code"
                    >

                    <a
                        href="{{ url_for('download_qr') }}"
                        class="download-btn"
                    >
                        Download QR
                    </a>

                    <a
                        href="{{ url_for('history') }}"
                        class="download-btn"
                    >
                        View History
                    </a>

                </div>

            {% endif %}

        </div>

    </div>

</body>
</html>
